name: Edição diária

# O cron do GitHub é em UTC e pode atrasar (ou até pular) execuções, principalmente
# em hora cheia. Por isso:
#   07:45 BRT  dispara cedo; o script espera até 08:00 em ponto e só então varre
#   08:05 BRT  reserva, se a primeira atrasou demais ou foi pulada
#   08:20 BRT  segunda reserva
# A edição só sai uma vez por dia: o estado commitado no repositório diz se ela já saiu.
on:
  schedule:
    - cron: "45 10 * * *"
    - cron: "5 11 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Enviar mesmo se a edição de hoje já saiu"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edicao
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Monta e envia
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=""
          if [ "${{ github.event_name }}" = "schedule" ]; then args="--aguardar-ate 08:00"; fi
          if [ "${{ inputs.forcar }}" = "true" ]; then args="--forcar"; fi
          python3 edicao.py $args

      - name: Guarda estado e edição no repositório
        run: |
          git config user.name "O Compilado"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados edicoes 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Edição de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
